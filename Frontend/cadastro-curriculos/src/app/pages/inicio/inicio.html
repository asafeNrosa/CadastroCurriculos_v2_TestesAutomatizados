<section class="text-center py-5">
  <h1 class="display-6 fw-semibold mb-3">Cadastro de Currículos</h1>
  <p class="text-body-secondary mb-4">
    Cadastre candidatos manualmente ou a partir de um currículo em PDF.
  </p>
  <div class="d-grid gap-3 col-12 col-sm-8 col-md-5 mx-auto">
    <a class="btn btn-primary btn-lg" routerLink="/candidatos/novo">Cadastrar currículo</a>
    <a class="btn btn-outline-primary btn-lg" routerLink="/candidatos">Conferir currículos</a>
  </div>

  @if (!auth.logado()) {
    <p class="small text-body-secondary mt-4 mb-0">
      Quer poder editar ou excluir o seu cadastro depois?
      <a routerLink="/entrar">Entre ou crie uma conta</a>.
    </p>
  }
</section>
